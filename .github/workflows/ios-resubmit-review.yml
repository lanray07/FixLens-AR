name: iOS Resubmit Review

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "App Store Connect app ID"
        required: true
        default: "6779688348"
      marketing_version:
        description: "App Store version"
        required: true
        default: "1.0"
      build_number:
        description: "Uploaded build number to submit"
        required: true
        default: "14"
      subscription_group_id:
        description: "Subscription group ID whose promotional images should be removed"
        required: true
        default: "22153311"

permissions:
  contents: read

jobs:
  resubmit:
    name: Attach build and submit App Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      APP_ID: ${{ inputs.app_id }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      SUBSCRIPTION_GROUP_ID: ${{ inputs.subscription_group_id }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install JWT helper
        run: gem install jwt --no-document

      - name: Validate App Store Connect secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is missing. Add the matching repository secret before running this workflow."
              missing=1
            fi
          done
          exit "$missing"

      - name: Resubmit to App Review
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "json"
          require "net/http"
          require "openssl"
          require "uri"
          require "jwt"

          API_BASE = "https://api.appstoreconnect.apple.com"
          APP_ID = ENV.fetch("APP_ID")
          MARKETING_VERSION = ENV.fetch("MARKETING_VERSION")
          BUILD_NUMBER = ENV.fetch("BUILD_NUMBER")
          SUBSCRIPTION_GROUP_ID = ENV.fetch("SUBSCRIPTION_GROUP_ID")

          private_key = OpenSSL::PKey::EC.new(ENV.fetch("ASC_PRIVATE_KEY").gsub("\\n", "\n"))
          token = JWT.encode(
            {
              iss: ENV.fetch("ASC_ISSUER_ID"),
              iat: Time.now.to_i,
              exp: Time.now.to_i + 20 * 60,
              aud: "appstoreconnect-v1"
            },
            private_key,
            "ES256",
            {
              kid: ENV.fetch("ASC_KEY_ID"),
              typ: "JWT"
            }
          )

          def request(method, path, token, body: nil, ok: [200, 201, 202, 204])
            uri = URI("#{API_BASE}#{path}")
            request_class = Net::HTTP.const_get(method.to_s.capitalize)
            req = request_class.new(uri)
            req["Authorization"] = "Bearer #{token}"
            req["Content-Type"] = "application/json"
            req["Accept"] = "application/json"
            req.body = JSON.dump(body) if body
            res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
            puts "#{method.to_s.upcase} #{uri} -> #{res.code}"
            unless ok.include?(res.code.to_i)
              warn res.body
              exit 1
            end
            res.body && !res.body.empty? ? JSON.parse(res.body) : nil
          end

          def query(params)
            URI.encode_www_form(params)
          end

          version_response = request(
            :get,
            "/v1/apps/#{APP_ID}/appStoreVersions?#{query(
              "filter[platform]" => "IOS",
              "filter[versionString]" => MARKETING_VERSION,
              "fields[appStoreVersions]" => "versionString,appVersionState,releaseType,build",
              "include" => "build",
              "limit" => "10"
            )}",
            token
          )
          app_store_version = version_response.fetch("data").find do |version|
            version.dig("attributes", "versionString") == MARKETING_VERSION
          end
          abort("No iOS App Store version #{MARKETING_VERSION} found for app #{APP_ID}") unless app_store_version
          app_store_version_id = app_store_version.fetch("id")
          puts "App Store version: #{app_store_version_id} (#{app_store_version.dig("attributes", "appVersionState")})"

          builds_response = request(
            :get,
            "/v1/builds?#{query(
              "filter[app]" => APP_ID,
              "filter[version]" => BUILD_NUMBER,
              "filter[preReleaseVersion.version]" => MARKETING_VERSION,
              "fields[builds]" => "version,processingState,usesNonExemptEncryption,uploadedDate,expired",
              "sort" => "-uploadedDate",
              "limit" => "10"
            )}",
            token
          )
          build = builds_response.fetch("data").find do |candidate|
            candidate.dig("attributes", "version") == BUILD_NUMBER &&
              candidate.dig("attributes", "processingState") == "VALID" &&
              !candidate.dig("attributes", "expired")
          end
          abort("No valid build #{BUILD_NUMBER} found for version #{MARKETING_VERSION}") unless build
          build_id = build.fetch("id")
          puts "Build: #{build_id} (#{BUILD_NUMBER})"

          request(
            :patch,
            "/v1/builds/#{build_id}",
            token,
            body: {
              data: {
                type: "builds",
                id: build_id,
                attributes: {
                  usesNonExemptEncryption: false
                }
              }
            }
          )

          subscriptions_response = request(
            :get,
            "/v1/subscriptionGroups/#{SUBSCRIPTION_GROUP_ID}/subscriptions?#{query(
              "fields[subscriptions]" => "name,productId,state",
              "limit" => "50"
            )}",
            token
          )
          subscriptions_response.fetch("data").each do |subscription|
            product_id = subscription.dig("attributes", "productId")
            images_response = request(
              :get,
              "/v1/subscriptions/#{subscription.fetch("id")}/images?#{query(
                "fields[subscriptionImages]" => "fileName,state,imageAsset",
                "limit" => "50"
              )}",
              token
            )
            images = images_response.fetch("data")
            if images.empty?
              puts "No promotional images found for #{product_id}"
            else
              images.each do |image|
                puts "Deleting promotional image #{image.fetch("id")} for #{product_id}"
                request(:delete, "/v1/subscriptionImages/#{image.fetch("id")}", token, ok: [204, 404])
              end
            end
          end

          request(
            :patch,
            "/v1/appStoreVersions/#{app_store_version_id}/relationships/build",
            token,
            body: {
              data: {
                type: "builds",
                id: build_id
              }
            }
          )
          puts "Attached build #{BUILD_NUMBER} to App Store version #{MARKETING_VERSION}"

          submissions_response = request(
            :get,
            "/v1/reviewSubmissions?#{query(
              "filter[app]" => APP_ID,
              "filter[platform]" => "IOS",
              "fields[reviewSubmissions]" => "platform,state,submittedDate,items,appStoreVersionForReview",
              "fields[reviewSubmissionItems]" => "state,appStoreVersion",
              "include" => "items,appStoreVersionForReview",
              "limit" => "10",
              "limit[items]" => "50"
            )}",
            token
          )
          review_submission = submissions_response.fetch("data").find do |submission|
            %w[UNRESOLVED_ISSUES READY_FOR_REVIEW].include?(submission.dig("attributes", "state"))
          end

          unless review_submission
            review_submission = request(
              :post,
              "/v1/reviewSubmissions",
              token,
              body: {
                data: {
                  type: "reviewSubmissions",
                  attributes: {
                    platform: "IOS"
                  },
                  relationships: {
                    app: {
                      data: {
                        type: "apps",
                        id: APP_ID
                      }
                    }
                  }
                }
              }
            ).fetch("data")
          end
          review_submission_id = review_submission.fetch("id")
          puts "Review submission: #{review_submission_id} (#{review_submission.dig("attributes", "state")})"

          item_exists = submissions_response.fetch("included", []).any? do |item|
            item["type"] == "reviewSubmissionItems" &&
              item.dig("relationships", "appStoreVersion", "data", "id") == app_store_version_id
          end
          unless item_exists
            request(
              :post,
              "/v1/reviewSubmissionItems",
              token,
              body: {
                data: {
                  type: "reviewSubmissionItems",
                  relationships: {
                    reviewSubmission: {
                      data: {
                        type: "reviewSubmissions",
                        id: review_submission_id
                      }
                    },
                    appStoreVersion: {
                      data: {
                        type: "appStoreVersions",
                        id: app_store_version_id
                      }
                    }
                  }
                }
              },
              ok: [201, 409]
            )
          end

          request(
            :patch,
            "/v1/reviewSubmissions/#{review_submission_id}",
            token,
            body: {
              data: {
                type: "reviewSubmissions",
                id: review_submission_id,
                attributes: {
                  submitted: true
                }
              }
            }
          )

          final_submission = request(
            :get,
            "/v1/reviewSubmissions/#{review_submission_id}?#{query(
              "fields[reviewSubmissions]" => "platform,state,submittedDate,appStoreVersionForReview"
            )}",
            token
          ).fetch("data")
          puts "Final review submission state: #{final_submission.dig("attributes", "state")}"
          RUBY
